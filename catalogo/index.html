<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Biblioteca · EcoNativo</title>
<style>
  :root{--bg:#f6f1e7;--card:#fff;--ink:#2b2b2b;--soft:#7a7266;--line:#e4dccc;--accent:#5C6B40;--accent2:#B5651D}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
  header{background:var(--accent);color:#fff;padding:16px 14px;position:sticky;top:0;z-index:5;box-shadow:0 2px 10px rgba(0,0,0,.15)}
  header h1{margin:0;font-size:20px;display:flex;align-items:center;gap:8px}
  header .sub{font-size:12px;opacity:.9;margin-top:2px}
  .wrap{max-width:820px;margin:0 auto;padding:12px}
  .filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
  .filters .full{grid-column:1/-1}
  input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:9px;font-size:14px;background:var(--card);color:var(--ink)}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
  .count{font-size:12px;color:var(--soft);margin:2px 2px 8px}
  .item{background:var(--card);border:1px solid var(--line);border-radius:11px;padding:11px 12px;margin-bottom:8px;cursor:pointer;display:flex;gap:10px;align-items:center;transition:.12s}
  .item:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(0,0,0,.06)}
  .item .t{font-size:15px;font-weight:700}
  .item .a{font-size:12px;color:var(--soft)}
  .item .g{font-size:11px;color:#9a917f;margin-top:2px}
  .item .code{font-family:'Courier New',monospace;font-size:10px;font-weight:700;color:var(--accent2);background:#fbf4ea;border:1px solid #eaddc7;border-radius:6px;padding:2px 6px;margin-top:3px;display:inline-block}
  .chev{color:var(--soft);flex-shrink:0}
  .empty{text-align:center;color:var(--soft);padding:40px 10px}
  .spin{display:inline-block;width:30px;height:30px;border:3px solid #ccc;border-top-color:var(--accent);border-radius:50%;animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  /* modal */
  .ov{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:16px;z-index:20}
  .ov.show{display:flex}
  .mb{background:var(--card);border-radius:14px;max-width:460px;width:100%;max-height:88vh;overflow:auto;padding:18px}
  .mb h2{margin:0 0 2px;font-size:19px}
  .mb .au{font-size:13px;color:var(--soft);margin-bottom:12px}
  .meta{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;font-size:13px;margin-bottom:12px}
  .meta .k{color:var(--soft);font-weight:600}
  .desc-h{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--accent);margin-bottom:3px}
  .desc{font-size:13.5px;line-height:1.55;background:var(--bg);border-radius:9px;padding:10px 12px}
  .cls{margin-top:14px;width:100%;padding:11px;border:none;border-radius:9px;background:var(--accent);color:#fff;font-size:14px;font-weight:700;cursor:pointer}
  .codebig{font-family:'Courier New',monospace;font-weight:700;color:var(--accent2);font-size:13px}
</style>
</head><body>
<header>
  <div class="wrap" style="padding:0">
    <h1>📚 Biblioteca EcoNativo</h1>
    <div class="sub">Catálogo de la cafetería literaria · busca y explora <span id="cnt"></span></div>
  </div>
</header>
<div class="wrap">
  <div id="loading" style="text-align:center;padding:50px 10px"><div class="spin"></div><div style="margin-top:12px;color:var(--soft)">Cargando catálogo…</div></div>
  <div id="app" style="display:none">
    <div class="filters">
      <input id="q" class="full" type="text" placeholder="🔎 Buscar por título…" oninput="render()">
      <input id="fa" list="dlA" placeholder="Autor…" oninput="render()">
      <select id="fn" onchange="render()"><option value="">Nacionalidad (todas)</option></select>
      <input id="fg" list="dlG" placeholder="Género…" oninput="render()">
      <input id="fs" list="dlS" placeholder="Subgénero…" oninput="render()">
    </div>
    <datalist id="dlA"></datalist><datalist id="dlG"></datalist><datalist id="dlS"></datalist>
    <div class="count" id="count"></div>
    <div id="list"></div>
  </div>
</div>
<div class="ov" id="modal" onclick="if(event.target===this)closeM()"><div class="mb">
  <h2 id="mT"></h2><div class="au" id="mA"></div>
  <div class="meta" id="mMeta"></div>
  <div id="mDescWrap" style="display:none"><div class="desc-h">Descripción</div><div class="desc" id="mDesc"></div></div>
  <button class="cls" onclick="closeM()">Cerrar</button>
</div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://xtprxnfvvynbakgonoau.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inh0cHJ4bmZ2dnluYmFrZ29ub2F1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA4NzgwNzQsImV4cCI6MjA5NjQ1NDA3NH0.e8V8A18bgI_q3LwsToQOtqDKIPvEVBgE4q5xONrebU8';
let BOOKS=[],FILT=[];
const $=i=>document.getElementById(i);
const g=(b,k)=>String((b&&b[k])||'').trim();
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const uniq=k=>[...new Set(BOOKS.map(b=>g(b,k)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));
function fillDatalists(){
  const nsel=$('fn');uniq('nc').forEach(v=>{const o=document.createElement('option');o.value=v;o.textContent=v;nsel.appendChild(o);});
  const dl=(id,k)=>{$(id).innerHTML=uniq(k).map(v=>'<option value="'+v.replace(/"/g,'&quot;')+'"></option>').join('');};
  dl('dlA','a');dl('dlG','g');dl('dlS','sg');
}
function render(){
  const q=($('q').value||'').toLowerCase().trim();
  const au=($('fa').value||'').toLowerCase().trim();
  const nc=($('fn').value||'').trim();
  const ge=($('fg').value||'').toLowerCase().trim();
  const sg=($('fs').value||'').toLowerCase().trim();
  FILT=BOOKS.filter(b=>(!q||g(b,'t').toLowerCase().includes(q))&&(!au||g(b,'a').toLowerCase().includes(au))&&(!nc||g(b,'nc')===nc)&&(!ge||g(b,'g').toLowerCase().includes(ge))&&(!sg||g(b,'sg').toLowerCase().includes(sg)));
  $('count').textContent=FILT.length+' de '+BOOKS.length+' libros';
  const CAP=400,show=FILT.slice(0,CAP);
  $('list').innerHTML=show.length?show.map((b,i)=>'<div class="item" onclick="openM('+i+')"><div style="flex:1;min-width:0"><div class="t" style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+esc(g(b,'t'))+'</div><div class="a">'+esc(g(b,'a'))+(g(b,'nc')?' · '+esc(g(b,'nc')):'')+'</div><div class="g">'+[g(b,'g'),g(b,'sg')].filter(Boolean).map(esc).join(' · ')+'</div>'+(g(b,'code')?'<div class="code">'+esc(g(b,'code'))+'</div>':'')+'</div><span class="chev">›</span></div>').join('')+(FILT.length>CAP?'<div class="empty">Mostrando '+CAP+' de '+FILT.length+'. Afina la búsqueda para ver más.</div>':''):'<div class="empty">Sin resultados para tu búsqueda.</div>';
}
function openM(i){
  const b=FILT[i];if(!b)return;
  $('mT').textContent=g(b,'t');
  $('mA').textContent='✍️ '+(g(b,'a')||'—');
  const rows=[['Código','code'],['Nacionalidad','nc'],['País','pais'],['Idioma','id'],['Género','g'],['Subgénero','sg'],['Editorial','ed'],['Edición','ec'],['ISBN','ib']];
  $('mMeta').innerHTML=rows.filter(([,k])=>g(b,k)).map(([lbl,k])=>'<div class="k">'+lbl+'</div><div'+(k==='code'?' class="codebig"':'')+'>'+esc(g(b,k))+'</div>').join('');
  const d=g(b,'d');$('mDescWrap').style.display=d?'block':'none';if(d)$('mDesc').textContent=d;
  $('modal').classList.add('show');
}
function closeM(){$('modal').classList.remove('show');}
(async()=>{
  try{
    const sb=window.supabase.createClient(SB_URL,SB_KEY);
    const {data}=await sb.from('econativo_state').select('payload').eq('key','book_catalog').maybeSingle();
    BOOKS=(data&&data.payload&&Array.isArray(data.payload.books))?data.payload.books:[];
    BOOKS.sort((a,b)=>g(a,'t').localeCompare(g(b,'t'),'es'));
    $('cnt').textContent='· '+BOOKS.length+' libros';
    $('loading').style.display='none';$('app').style.display='block';
    fillDatalists();render();
  }catch(e){
    $('loading').innerHTML='<div class="empty">No se pudo cargar el catálogo.<br><span style="font-size:12px">'+(e&&e.message||'')+'</span></div>';
  }
})();
</script>
</body></html>
